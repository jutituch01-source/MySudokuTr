<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap">
<style>
:root{--bg:#efe9dc;--panel:#e4dccb;--ink:#2a2418;--mute:#7b705a;--line:#b9ac90;--acc:#a8501f;--sel:#f3c98b;--peer:#e9dcc0;--bad:#c23b2a;--badbg:#f5cfc6;--given:#2a2418;--mine:#1f5a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--panel:#1c222c;--ink:#e8e2d2;--mute:#8d93a0;--line:#3a4352;--acc:#e0a45c;--sel:#4a3d27;--peer:#232b38;--bad:#ff7b66;--badbg:#4a2622;--given:#e8e2d2;--mine:#7cc0f0}}
:root[data-theme="dark"]{--bg:#14181f;--panel:#1c222c;--ink:#e8e2d2;--mute:#8d93a0;--line:#3a4352;--acc:#e0a45c;--sel:#4a3d27;--peer:#232b38;--bad:#ff7b66;--badbg:#4a2622;--given:#e8e2d2;--mine:#7cc0f0}
:root:root{--boardbg:rgba(0,0,0,.7);--glow:rgba(124,240,255,.25);--onacc:#06101a;--bg:#000;--panel:rgba(18,26,42,.72);--ink:#e6efff;--mute:#8aa0c4;--line:rgba(124,160,255,.28);--acc:#7cf0ff;--sel:rgba(124,240,255,.22);--peer:rgba(124,240,255,.07);--bad:#ff7b66;--badbg:rgba(255,107,90,.28);--given:#f2f6ff;--mine:#7cf0ff}
:root:root[data-theme="light"]{--boardbg:rgba(255,255,255,.8);--glow:rgba(10,107,214,.18);--onacc:#fff;--bg:#fff;--panel:rgba(238,242,250,.9);--ink:#0b1020;--mute:#5a6a88;--line:rgba(40,70,140,.3);--acc:#0a6bd6;--sel:rgba(10,107,214,.2);--peer:rgba(10,107,214,.07);--bad:#c62828;--badbg:rgba(198,40,40,.16);--given:#0b1020;--mine:#0a6bd6}
.stats button{padding:3px 10px;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:16px;line-height:1}
[hidden]{display:none!important}
.stats{gap:8px;flex-wrap:wrap;justify-content:flex-end}
#th,#so{display:none}
.stats button{padding:3px 7px}
h1{font-size:22px}
body.inmenu main{display:none}
#menu{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
body.inmenu #menu{display:flex}
#menu h1{font-size:clamp(46px,16vw,84px);letter-spacing:.06em;margin:0;text-shadow:0 0 28px var(--acc),0 2px 0 rgba(0,0,0,.35)}
#menu p{margin:0 0 6px;color:var(--ink);font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.mb{width:min(260px,70vw);padding:14px;border:1px solid var(--acc);background:var(--panel);backdrop-filter:blur(6px);color:var(--ink);border-radius:10px;font-size:20px;font-weight:700}
.mb.pri{background:var(--acc);color:var(--onacc)}
#rkc{width:min(260px,70vw);font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px)}
#rkc b{color:var(--acc);font-size:18px}
.pg{height:6px;border-radius:3px;background:var(--line);margin:6px 0;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--acc)}
#set{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#set .card{width:min(100%,420px);max-height:92vh;overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--acc);border-radius:12px;padding:16px 18px;color:var(--ink)}
#set h2{margin:0 0 6px;font-size:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;font-size:15px}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.row .lv{margin:0;flex:1;grid-template-columns:repeat(auto-fit,minmax(56px,1fr))}
:root:root[data-bg='castle']{--acc:#ffd27c;--sel:rgba(255,210,124,.22);--peer:rgba(255,210,124,.07);--line:rgba(255,210,124,.28);--mine:#ffe3a3;--glow:rgba(255,210,124,.25)}
:root:root[data-bg='castle'][data-theme='light']{--acc:#a8501f;--sel:rgba(168,80,31,.2);--peer:rgba(168,80,31,.07);--line:rgba(120,70,50,.3);--mine:#a8501f;--glow:rgba(168,80,31,.18);--onacc:#fff}
@keyframes glowg{0%{box-shadow:0 0 0 0 rgba(255,210,124,.95),inset 0 0 22px rgba(255,210,124,.95);transform:scale(1.18);text-shadow:0 0 12px #ffd27c}100%{box-shadow:0 0 0 16px rgba(255,210,124,0),inset 0 0 0 rgba(255,210,124,0);transform:scale(1)}}
[data-bg='castle'] .c.fl{animation-name:glowg}
#fxc{position:fixed;inset:0;width:100%;height:100%;z-index:35;pointer-events:none}
#ov{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:rgba(0,0,0,.45)}
#ov.win{background:rgba(0,0,0,.28)}
#ovt{font-size:clamp(52px,17vw,110px);font-weight:700;letter-spacing:.06em;line-height:1;animation:ovp .7s ease-out}
#ov.over #ovt{color:#ff7b66;text-shadow:0 0 30px #ff3b2a}
#ov.win #ovt{color:#ffd27c;text-shadow:0 0 34px #ffb347}
#ovs{max-width:420px;font-size:16px;color:#fff;text-shadow:0 1px 6px #000}
#ovh{font-size:14px;color:rgba(255,255,255,.8);opacity:0;transition:opacity .5s}
#ovh.on{opacity:1;animation:blink 1.4s infinite}
#sh2{padding:8px 16px;border:1px solid #ffd27c;background:rgba(0,0,0,.4);border-radius:6px;color:#ffd27c;font-size:15px}
@keyframes ovp{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
@keyframes blink{50%{opacity:.35}}
.c.ai{animation:aig 1s linear;z-index:2}
@keyframes aig{0%,30%{color:transparent;text-shadow:none}35%{color:#7cf0ff;transform:translateX(-3px)}45%{color:#c58cff;transform:translateX(3px)}55%{color:#7cf0ff;transform:translateX(-2px)}70%{color:#7cf0ff;transform:none;text-shadow:0 0 16px #b58cff}100%{text-shadow:none}}
#board.shk{animation:shk .16s}
@keyframes shk{0%,100%{transform:translate(0)}30%{transform:translate(-2px,1px)}70%{transform:translate(2px,-1px)}}
@media (prefers-reduced-motion:reduce){#board.shk,.c.ai,#ovt{animation:none}}
#scare{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
#scare.out{opacity:0;transition:opacity .35s}
#scare img{max-width:100%;max-height:100%;object-fit:contain;filter:contrast(1.1);animation:scz 1.4s ease-out forwards}
#scare::after{content:'';position:absolute;inset:0;background:#f00;animation:srf .3s ease-out forwards}
@keyframes srf{0%{opacity:.55}100%{opacity:0}}
@keyframes scz{0%{transform:scale(1.2)}8%{transform:scale(1.3) translate(-8px,5px)}16%{transform:scale(1.35) translate(7px,-6px)}24%{transform:scale(1.4) translate(-6px,-4px)}32%{transform:scale(1.45) translate(6px,5px)}40%{transform:scale(1.5) translate(-5px,3px)}50%{transform:scale(1.58) translate(4px,-4px)}100%{transform:scale(1.85)}}
@media (prefers-reduced-motion:reduce){#scare img,#scare::after{animation:none}}
#jst{padding:6px 12px;border:1px solid var(--line);background:transparent;border-radius:6px;color:var(--ink)}
#hud{display:flex;justify-content:space-between;font-size:15px;color:var(--mute);margin-bottom:8px;min-height:22px}
#hud b{color:var(--ink);font-weight:500}
#cb{color:var(--acc);font-weight:700}
#race{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--mute)}
.bar{height:8px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
#rb{background:var(--bad)}
#ann{position:fixed;left:0;right:0;top:20%;text-align:center;font-size:clamp(30px,10vw,56px);font-weight:700;color:var(--acc);text-shadow:0 0 18px var(--acc);pointer-events:none;opacity:0;z-index:5}
#ann.go{animation:ann 1.3s ease-out}
@keyframes ann{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05) translateY(-14px)}}
#board.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
#sh{display:block;margin:8px auto 0;padding:8px 16px;border:1px solid var(--acc);background:transparent;border-radius:6px;color:var(--acc)}
@media (prefers-reduced-motion:reduce){#ann.go,#board.shake{animation:none}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1}
.c.fl{animation:glow .8s ease-out;z-index:2}
.c.flx{animation:glowx .8s ease-out;z-index:2}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(124,240,255,.95),inset 0 0 22px rgba(124,240,255,.95);transform:scale(1.18);text-shadow:0 0 12px #7cf0ff}100%{box-shadow:0 0 0 16px rgba(124,240,255,0),inset 0 0 0 rgba(124,240,255,0);transform:scale(1)}}
@keyframes glowx{0%{box-shadow:0 0 0 0 rgba(255,107,90,.95),inset 0 0 22px rgba(255,107,90,.9);transform:scale(1.18)}100%{box-shadow:0 0 0 16px rgba(255,107,90,0),inset 0 0 0 rgba(255,107,90,0);transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.c.fl,.c.flx{animation:none}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
main{width:min(100%,480px);padding:16px 14px 28px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
h1{font-size:26px;margin:0;letter-spacing:.04em;font-weight:700}
.stats{display:flex;gap:14px;font-size:15px;color:var(--mute)}
.stats b{color:var(--ink);font-weight:500}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.lv button{padding:8px 0;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:14px}
.lv button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
#board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;border:2px solid var(--acc);box-shadow:0 0 24px var(--glow);background:var(--boardbg);backdrop-filter:blur(3px);user-select:none}
.c{position:relative;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;font-size:clamp(18px,6vw,28px);padding:0;display:flex;align-items:center;justify-content:center;min-width:0}
.c:nth-child(9n){border-right:0}.c:nth-child(n+73){border-bottom:0}
.c:nth-child(3n):not(:nth-child(9n)){border-right:2px solid var(--ink)}
.c:nth-child(n+19):nth-child(-n+27),.c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--ink)}
.c.peer{background:var(--peer)}.c.same{background:var(--sel)}.c.sel{background:var(--sel);outline:2px solid var(--acc);outline-offset:-2px;z-index:1}
.c.given{color:var(--given);font-weight:700}.c.mine{color:var(--mine);font-weight:500}
.c.bad{color:var(--bad);background:var(--badbg)}
.n{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(8px,2.4vw,11px);color:var(--mute);line-height:1;padding:2px}
.n i{font-style:normal;display:flex;align-items:center;justify-content:center}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:12px}
#pad button{aspect-ratio:.8;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:clamp(18px,5.5vw,24px);display:flex;flex-direction:column;align-items:center;justify-content:center}
#pad button small{font-size:10px;color:var(--mute)}
#pad button:disabled{opacity:.3;cursor:default}
.act{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.act button{padding:10px 0;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:14px}
.act button[aria-pressed="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.seed{display:flex;gap:6px;margin-top:14px;align-items:center;font-size:13px;color:var(--mute)}
.seed input{flex:1;min-width:0;font:inherit;padding:7px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px}
.seed button{padding:7px 12px;border:1px solid var(--line);background:transparent;border-radius:6px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#msg{min-height:22px;margin-top:10px;font-size:15px;text-align:center;color:var(--acc)}
</style>
</head>
